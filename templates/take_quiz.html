{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <!-- Cyber Header -->
    <div class="cyber-header mb-4" data-aos="fade-down">
        <div class="cyber-header-glow"></div>
        <div class="cyber-header-content text-center">
            <div class="quiz-icon">
                <i class="fas fa-pen-fancy"></i>
                <div class="quiz-ring"></div>
            </div>
            <h1 class="cyber-title" id="quizTitle">Loading Quiz...</h1>
            <p class="cyber-subtitle" id="quizDesc"></p>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="glass-card">
                <div class="card-header-cyber">
                    <div class="header-left">
                        <i class="fas fa-clock"></i> TIME REMAINING
                    </div>
                    <div class="timer-badge" id="timerDisplay">00:00</div>
                </div>
                <div class="card-body-cyber" id="questionsContainer">
                    <div class="loading-container">
                        <div class="cyber-spinner"></div>
                        <span>Loading questions...</span>
                    </div>
                </div>
                <div class="card-footer-cyber">
                    <button class="submit-quiz-btn" onclick="submitQuiz()">
                        <i class="fas fa-check-circle"></i> SUBMIT QUIZ
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.cyber-header {
    position: relative;
    text-align: center;
    padding: 30px;
    background: linear-gradient(135deg, rgba(0, 255, 136, 0.05), rgba(0, 212, 255, 0.02));
    border-radius: 40px;
    overflow: hidden;
}

.cyber-header-glow {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.1), transparent);
    animation: headerPulse 3s ease-in-out infinite;
}

@keyframes headerPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
}

.quiz-icon {
    position: relative;
    display: inline-block;
    margin-bottom: 15px;
}

.quiz-icon i {
    font-size: 2.5rem;
    color: #00ff88;
}

.quiz-ring {
    position: absolute;
    top: -10px;
    left: -10px;
    right: -10px;
    bottom: -10px;
    border: 2px solid rgba(0, 255, 136, 0.3);
    border-radius: 50%;
    animation: ringPulse 2s ease-out infinite;
}

@keyframes ringPulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.5); opacity: 0; }
}

.cyber-title {
    font-size: 1.8rem;
    font-weight: 800;
    background: linear-gradient(135deg, #00ff88, #00d4ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.cyber-subtitle {
    color: #a0a0a0;
    font-size: 1rem;
}

.glass-card {
    background: linear-gradient(135deg, rgba(15, 15, 26, 0.95), rgba(26, 26, 46, 0.95));
    backdrop-filter: blur(10px);
    border-radius: 24px;
    border: 1px solid rgba(0, 255, 136, 0.3);
    overflow: hidden;
}

.card-header-cyber {
    padding: 15px 20px;
    background: linear-gradient(90deg, rgba(0, 255, 136, 0.1), rgba(0, 212, 255, 0.05));
    border-bottom: 1px solid rgba(0, 255, 136, 0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: #00ff88;
}

.timer-badge {
    background: rgba(0, 255, 136, 0.15);
    padding: 6px 20px;
    border-radius: 30px;
    font-family: monospace;
    font-size: 1.2rem;
    font-weight: bold;
    color: #00ff88;
}

.card-body-cyber {
    padding: 25px;
    max-height: 500px;
    overflow-y: auto;
}

.question-card {
    background: rgba(0, 255, 136, 0.05);
    border: 1px solid rgba(0, 255, 136, 0.2);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
}

.question-text {
    font-size: 1rem;
    font-weight: bold;
    margin-bottom: 15px;
    color: #fff;
}

.options-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.option-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 15px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.option-item:hover {
    background: rgba(0, 255, 136, 0.1);
}

.option-radio {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #00ff88;
}

.option-text {
    font-size: 0.9rem;
    color: #e0e0e0;
    cursor: pointer;
    flex: 1;
}

.card-footer-cyber {
    padding: 15px 20px;
    border-top: 1px solid rgba(0, 255, 136, 0.3);
}

.submit-quiz-btn {
    width: 100%;
    background: linear-gradient(135deg, #00ff88, #00d4ff);
    border: none;
    border-radius: 30px;
    padding: 12px;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.submit-quiz-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
}

.loading-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 60px;
    color: #a0a0a0;
}

.cyber-spinner {
    width: 30px;
    height: 30px;
    border: 2px solid rgba(0, 255, 136, 0.2);
    border-top-color: #00ff88;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.card-body-cyber::-webkit-scrollbar {
    width: 5px;
}

.card-body-cyber::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
}

.card-body-cyber::-webkit-scrollbar-thumb {
    background: #00ff88;
    border-radius: 10px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
const quizId = {{ quiz_id }};
let quizData = null;
let answers = {};
let timerInterval = null;
let timeLeft = 0;

// Load quiz data
async function loadQuiz() {
    try {
        console.log("Loading quiz ID:", quizId);
        
        const response = await fetch(`/api/quiz/${quizId}`);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        quizData = await response.json();
        console.log("Quiz data loaded:", quizData);
        
        document.getElementById('quizTitle').innerText = quizData.title;
        document.getElementById('quizDesc').innerHTML = `${quizData.description || ''} • ${quizData.questions.length} questions`;
        
        // Start timer
        timeLeft = (quizData.time_limit || 30) * 60;
        startTimer();
        
        // Display questions
        let html = '';
        quizData.questions.forEach((q, idx) => {
            html += `
                <div class="question-card" data-question-id="${q.question_id}">
                    <div class="question-text">${idx + 1}. ${escapeHtml(q.question_text)}</div>
                    <div class="options-list">
                        ${q.options.map((opt, optIdx) => {
                            const letter = String.fromCharCode(65 + optIdx);
                            if (opt && opt.trim()) {
                                return `
                                    <label class="option-item">
                                        <input type="radio" name="q_${q.question_id}" value="${letter}" class="option-radio" onchange="saveAnswer(${q.question_id}, '${letter}')">
                                        <span class="option-text">${letter}. ${escapeHtml(opt)}</span>
                                    </label>
                                `;
                            }
                            return '';
                        }).join('')}
                    </div>
                    <div class="question-points mt-2"><small class="text-muted">Points: ${q.points || 1}</small></div>
                </div>
            `;
        });
        document.getElementById('questionsContainer').innerHTML = html;
        
    } catch(err) {
        console.error('Error loading quiz:', err);
        document.getElementById('questionsContainer').innerHTML = `<div class="text-center text-danger">Error loading quiz: ${err.message}</div>`;
    }
}

function saveAnswer(questionId, answer) {
    answers[questionId] = answer;
    console.log("Answer saved:", questionId, "=", answer);
    console.log("All answers:", answers);
}

function startTimer() {
    timerInterval = setInterval(() => {
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            submitQuiz();
        } else {
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
    }, 1000);
}

async function submitQuiz() {
    // Stop timer
    if (timerInterval) clearInterval(timerInterval);
    
    // Check if any questions were answered
    const totalQuestions = quizData ? quizData.questions.length : 0;
    const answeredCount = Object.keys(answers).length;
    
    console.log("Submitting quiz. Answers:", answers);
    console.log(`Answered ${answeredCount} out of ${totalQuestions} questions`);
    
    if (answeredCount < totalQuestions) {
        const result = await Swal.fire({
            title: 'Not Finished!',
            text: `You've answered ${answeredCount} out of ${totalQuestions} questions. Submit anyway?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#00ff88',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Yes, submit',
            cancelButtonText: 'Continue',
            background: '#1a1a2e',
            color: '#ffffff'
        });
        if (!result.isConfirmed) {
            // Restart timer
            startTimer();
            return;
        }
    }
    
    // Show loading
    Swal.fire({
        title: 'Submitting...',
        text: 'Please wait while we grade your quiz',
        allowOutsideClick: false,
        didOpen: () => {
            Swal.showLoading();
        },
        background: '#1a1a2e'
    });
    
    try {
        const response = await fetch('/api/submit-quiz', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ 
                quiz_id: quizId, 
                answers: answers 
            })
        });
        
        const result = await response.json();
        console.log("Submit result:", result);
        
        if (result.success) {
            let message = `Score: ${result.score}/${result.total_possible} (${result.percentage}%)`;
            let icon = 'info';
            
            if (result.percentage >= 80) {
                message += '\n\n🎉 Excellent! You earned bonus points!';
                icon = 'success';
            } else if (result.percentage >= 60) {
                message += '\n\n👍 Good job! Keep practicing!';
                icon = 'success';
            } else {
                message += '\n\n📚 Keep learning! Review and try again.';
                icon = 'info';
            }
            
            Swal.fire({
                title: 'Quiz Submitted!',
                text: message,
                icon: icon,
                confirmButtonColor: '#00ff88',
                background: '#1a1a2e',
                color: '#ffffff'
            }).then(() => {
                window.location.href = '/quizzes';
            });
        } else {
            Swal.fire({
                title: 'Error!',
                text: result.error || 'Failed to submit quiz',
                icon: 'error',
                confirmButtonColor: '#00ff88',
                background: '#1a1a2e',
                color: '#ffffff'
            });
        }
    } catch(err) {
        console.error('Submit error:', err);
        Swal.fire({
            title: 'Error!',
            text: 'Failed to submit quiz: ' + err.message,
            icon: 'error',
            confirmButtonColor: '#00ff88',
            background: '#1a1a2e',
            color: '#ffffff'
        });
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Load quiz when page loads
loadQuiz();
</script>
{% endblock %}
