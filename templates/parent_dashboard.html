{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <!-- Cyber Header -->
    <div class="cyber-header mb-5" data-aos="fade-down">
        <div class="cyber-header-glow"></div>
        <div class="cyber-header-content text-center">
            <div class="cyber-badge">
                <i class="fas fa-microchip"></i> PARENT PORTAL
                <span class="live-badge">LIVE</span>
            </div>
            <div class="parent-icon">
                <i class="fas fa-users"></i>
                <div class="icon-ring"></div>
            </div>
            <h1 class="cyber-title">
                <span class="gradient-text">WELCOME</span>
                <span class="neon-text"> Parent of {{ current_user.name }}</span>
            </h1>
            <p class="cyber-subtitle">Monitor your child's academic journey • Real-time updates</p>
        </div>
    </div>

    <!-- Quick Actions Row -->
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="quick-actions">
                <a href="{{ url_for('parent_communication') }}" class="action-btn-primary">
                    <i class="fas fa-envelope"></i>
                    <span>Contact School</span>
                    <div class="btn-glow"></div>
                </a>
                <a href="{{ url_for('reports') }}" class="action-btn-secondary">
                    <i class="fas fa-file-alt"></i>
                    <span>View Reports</span>
                </a>
                <a href="{{ url_for('certificates') }}" class="action-btn-secondary">
                    <i class="fas fa-certificate"></i>
                    <span>Certificates</span>
                </a>
                <a href="{{ url_for('meetings') }}" class="action-btn-secondary">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Schedule Meeting</span>
                </a>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card bg-dark border-success">
                <div class="card-header bg-success text-white">
                    <h5><i class="fas fa-child"></i> Your Child's Performance</h5>
                </div>
                <div class="card-body" id="childData">
                    <div class="text-center py-4">
                        <div class="spinner-border text-success"></div>
                        <p class="mt-2">Loading child data...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.quick-actions {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

.action-btn-primary, .action-btn-secondary {
    position: relative;
    padding: 12px 28px;
    border-radius: 40px;
    font-weight: bold;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: all 0.3s ease;
    overflow: hidden;
}

.action-btn-primary {
    background: linear-gradient(135deg, #00ff88, #00d4ff);
    color: #000;
}

.action-btn-secondary {
    background: rgba(0, 255, 136, 0.15);
    border: 1px solid rgba(0, 255, 136, 0.3);
    color: #00ff88;
}

.action-btn-primary:hover, .action-btn-secondary:hover {
    transform: translateY(-2px);
    text-decoration: none;
}

.action-btn-primary:hover {
    filter: brightness(1.1);
}

.action-btn-secondary:hover {
    background: rgba(0, 255, 136, 0.3);
}

.btn-glow {
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s ease;
}

.action-btn-primary:hover .btn-glow {
    left: 100%;
}

.cyber-header {
    position: relative;
    text-align: center;
    padding: 40px;
    background: linear-gradient(135deg, rgba(0, 255, 136, 0.05), rgba(0, 212, 255, 0.02));
    border-radius: 50px;
    overflow: hidden;
}

.cyber-header-glow {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.1), transparent);
    animation: headerPulse 3s ease-in-out infinite;
}

@keyframes headerPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
}

.cyber-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: rgba(0, 255, 136, 0.1);
    padding: 8px 20px;
    border-radius: 30px;
    font-size: 0.75rem;
    color: #00ff88;
    border: 1px solid rgba(0, 255, 136, 0.3);
    margin-bottom: 20px;
}

.live-badge {
    background: #00ff88;
    color: #000;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 0.65rem;
    font-weight: bold;
    animation: livePulse 1s ease-in-out infinite;
}

@keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.95); }
}

.parent-icon {
    position: relative;
    display: inline-block;
    margin-bottom: 20px;
}

.parent-icon i {
    font-size: 3rem;
    color: #00ff88;
}

.icon-ring {
    position: absolute;
    top: -15px;
    left: -15px;
    right: -15px;
    bottom: -15px;
    border: 2px solid rgba(0, 255, 136, 0.3);
    border-radius: 50%;
    animation: ringPulse 2s ease-out infinite;
}

.icon-ring.delay-1 { animation-delay: 0.7s; }
.icon-ring.delay-2 { animation-delay: 1.4s; }

@keyframes ringPulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.5); opacity: 0; }
}

.cyber-title {
    font-size: 2.5rem;
    font-weight: 800;
    margin-bottom: 15px;
}

.gradient-text {
    background: linear-gradient(135deg, #00ff88, #00d4ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.neon-text {
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
}

.cyber-subtitle {
    color: #a0a0a0;
    font-size: 1rem;
}

.card {
    background: linear-gradient(135deg, #1a1a2e, #16213e) !important;
    border: 1px solid rgba(0, 255, 136, 0.2) !important;
}

.card-header {
    background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), rgba(0, 212, 255, 0.05)) !important;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
AOS.init({ duration: 800, once: true });

const studentId = '{{ current_user.student_id }}';

async function loadChildData() {
    try {
        const response = await fetch(`/api/student-data/${studentId}`);
        const data = await response.json();
        
        document.getElementById('childData').innerHTML = `
            <div class="row">
                <div class="col-md-6">
                    <table class="table table-dark">
                        <tr><th>Student Name</th><td><strong>${data.student.name}</strong></td></tr>
                        <tr><th>Student ID</th><td>${data.student.student_id}</td></tr>
                        <tr><th>Final Score</th><td><strong class="text-success">${data.student.final_score}%</strong></td></tr>
                        <tr><th>Grade</th><td><span class="badge bg-success">${data.student.grade}</span></td></tr>
                        <tr><th>Class Rank</th><td>#${data.rank} / ${data.total_students}</td>
                        <tr><th>Attendance</th><td>${data.student.attendance_percentage}%</td>
                        <tr><th>Study Hours</th><td>${data.student.study_hours} hours/day</td>
                    </table>
                </div>
                <div class="col-md-6">
                    <canvas id="scoresChart" height="250"></canvas>
                </div>
            </div>
            <div class="alert alert-info mt-3">
                <i class="fas fa-envelope"></i> Weekly reports will be sent to your email automatically.
            </div>
        `;
        
        new Chart(document.getElementById('scoresChart'), {
            type: 'bar',
            data: {
                labels: ['Midterm', 'Assignment', 'Quiz', 'Project'],
                datasets: [{ 
                    label: 'Scores', 
                    data: [data.student.midterm_score, data.student.assignment_score, data.student.quiz_score, data.student.project_score], 
                    backgroundColor: '#28a745',
                    borderRadius: 10
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { labels: { color: '#fff' } }
                },
                scales: {
                    y: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                    x: { ticks: { color: '#fff' } }
                }
            }
        });
    } catch(err) {
        console.error('Error:', err);
        document.getElementById('childData').innerHTML = '<div class="alert alert-danger">Error loading data</div>';
    }
}

loadChildData();
</script>
{% endblock %}
