{% extends "base.html" %}

{% block content %}
<div class="container-fluid min-vh-100">
    <div class="row min-vh-100 align-items-center justify-content-center">
        <div class="col-md-5" data-aos="zoom-in" data-aos-duration="800">
            <div class="login-card glass-effect p-5">
                <div class="text-center mb-4">
                    <div class="cyber-icon mb-3">
                        <i class="fas fa-users fa-4x text-warning"></i>
                    </div>
                    <h2 class="gradient-text">Parent Portal</h2>
                    <p class="text-muted">Monitor your child's academic progress</p>
                </div>
                
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i> {{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-warning">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-warning"><i class="fas fa-envelope text-warning"></i></span>
                            <input type="email" name="email" class="form-control cyber-input" placeholder="Enter registered email" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-warning">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-warning"><i class="fas fa-lock text-warning"></i></span>
                            <input type="password" name="password" class="form-control cyber-input" placeholder="Enter password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 py-2">
                        <i class="fas fa-users me-2"></i> View Child's Progress
                    </button>
                </form>
                
                
                    <div class="text-center mt-2">
                        <small class="text-muted">Demo Login- Email: parent.s[ID]@example.com | Password: parent[number]123</small>
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <a href="{{ url_for('index') }}" class="text-muted text-decoration-none">
                        <i class="fas fa-arrow-left me-1"></i> Back to Home
                    </a>
                    <span class="text-muted mx-2">|</span>
                    <a href="{{ url_for('login') }}" class="text-success text-decoration-none">
                        Admin Login <i class="fas fa-arrow-right ms-1"></i>
                    </a>
                    <span class="text-muted mx-2">|</span>
                    <a href="{{ url_for('student_login') }}" class="text-info text-decoration-none">
                        Student Login <i class="fas fa-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.login-card {
    background: rgba(26, 26, 46, 0.9);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 193, 7, 0.3);
    border-radius: 28px;
    box-shadow: 0 0 40px rgba(255, 193, 7, 0.1);
}

.cyber-input {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 193, 7, 0.3);
    color: #ffffff;
    padding: 12px 15px;
}

.cyber-input:focus {
    background: rgba(0, 0, 0, 0.8);
    border-color: #ffc107;
    box-shadow: 0 0 15px rgba(255, 193, 7, 0.3);
    color: #ffffff;
}

.input-group-text {
    background: rgba(255, 193, 7, 0.1);
    border: 1px solid rgba(255, 193, 7, 0.3);
}

.demo-card {
    background: rgba(255, 193, 7, 0.05);
    border: 1px dashed rgba(255, 193, 7, 0.3);
}

.demo-card table {
    color: #fff;
    font-size: 0.75rem;
}

.demo-card table td {
    padding: 5px;
}

.btn-warning {
    background: linear-gradient(135deg, #ffc107, #ff9800);
    border: none;
    color: #000000;
    font-weight: bold;
}

.btn-warning:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(255, 193, 7, 0.4);
}

.cyber-icon {
    animation: cyberPulse 2s ease-in-out infinite;
}

@keyframes cyberPulse {
    0%, 100% { text-shadow: 0 0 10px #ffc107; }
    50% { text-shadow: 0 0 30px #ffc107, 0 0 50px #ff9800; }
}
</style>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>AOS.init({ duration: 800 });</script>
{% endblock %}
