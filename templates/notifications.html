{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <!-- Cyber Header -->
    <div class="cyber-header mb-5" data-aos="fade-down" data-aos-duration="800">
        <div class="cyber-header-glow"></div>
        <div class="cyber-header-content">
            <div class="cyber-badge">
                <i class="fas fa-microchip"></i> NOTIFICATION CENTER
                <span class="live-badge">LIVE</span>
            </div>
            <div class="bell-icon">
                <i class="fas fa-bell"></i>
                <div class="bell-ring"></div>
                <div class="bell-ring delay-1"></div>
            </div>
            <h1 class="cyber-title">
                <span class="gradient-text">ALERT</span>
                <span class="neon-text">HUB</span>
            </h1>
            <p class="cyber-subtitle">Real-time updates • Activity alerts • Achievement notifications</p>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-10 mx-auto">
            <div class="notifications-container">
                <div class="notifications-header">
                    <div class="header-left">
                        <i class="fas fa-bell"></i> NOTIFICATIONS
                        <span class="unread-badge" id="unreadBadge">0</span>
                    </div>
                    <div class="header-right">
                        <button class="mark-all-btn" onclick="markAllRead()">
                            <i class="fas fa-check-double"></i> MARK ALL READ
                        </button>
                        <button class="refresh-btn" onclick="loadNotifications()">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>
                
                <div class="notifications-list" id="notificationsList">
                    <div class="loading-container">
                        <div class="cyber-spinner"></div>
                        <span>Loading notifications...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* Notifications Page Styles */
.cyber-header {
    position: relative;
    text-align: center;
    padding: 40px;
    background: linear-gradient(135deg, rgba(0, 255, 136, 0.05), rgba(0, 212, 255, 0.02));
    border-radius: 50px;
    overflow: hidden;
}

.cyber-header-glow {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.1), transparent);
    animation: headerPulse 3s ease-in-out infinite;
}

@keyframes headerPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
}

.cyber-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: rgba(0, 255, 136, 0.1);
    padding: 8px 20px;
    border-radius: 30px;
    font-size: 0.75rem;
    color: #00ff88;
    border: 1px solid rgba(0, 255, 136, 0.3);
    margin-bottom: 20px;
}

.live-badge {
    background: #00ff88;
    color: #000;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 0.65rem;
    font-weight: bold;
    animation: livePulse 1s ease-in-out infinite;
}

@keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.95); }
}

.bell-icon {
    position: relative;
    display: inline-block;
    margin-bottom: 20px;
}

.bell-icon i {
    font-size: 3rem;
    color: #ffd700;
}

.bell-ring {
    position: absolute;
    top: -10px;
    right: -10px;
    width: 20px;
    height: 20px;
    background: #ff4444;
    border-radius: 50%;
    animation: ringPulse 1.5s ease-out infinite;
}

.bell-ring.delay-1 {
    animation-delay: 0.5s;
}

@keyframes ringPulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(2); opacity: 0; }
}

.cyber-title {
    font-size: 2.5rem;
    font-weight: 800;
    margin-bottom: 15px;
}

.gradient-text {
    background: linear-gradient(135deg, #00ff88, #00d4ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.neon-text {
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
}

.cyber-subtitle {
    color: #a0a0a0;
    font-size: 1rem;
}

/* Notifications Container */
.notifications-container {
    background: linear-gradient(135deg, rgba(15, 15, 26, 0.95), rgba(26, 26, 46, 0.95));
    backdrop-filter: blur(10px);
    border-radius: 28px;
    border: 1px solid rgba(0, 255, 136, 0.3);
    overflow: hidden;
}

.notifications-header {
    padding: 18px 24px;
    background: linear-gradient(90deg, rgba(0, 255, 136, 0.1), rgba(0, 212, 255, 0.05));
    border-bottom: 1px solid rgba(0, 255, 136, 0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.85rem;
    color: #00ff88;
}

.unread-badge {
    background: #ff4444;
    color: #fff;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.7rem;
}

.header-right {
    display: flex;
    gap: 10px;
}

.mark-all-btn, .refresh-btn {
    background: rgba(0, 255, 136, 0.15);
    border: 1px solid rgba(0, 255, 136, 0.3);
    border-radius: 20px;
    padding: 6px 15px;
    color: #00ff88;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
}

.mark-all-btn:hover, .refresh-btn:hover {
    background: rgba(0, 255, 136, 0.3);
    transform: translateY(-2px);
}

/* Notifications List */
.notifications-list {
    max-height: 600px;
    overflow-y: auto;
}

.notification-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 18px 24px;
    border-bottom: 1px solid rgba(0, 255, 136, 0.1);
    transition: all 0.3s ease;
    cursor: pointer;
}

.notification-item:hover {
    background: rgba(0, 255, 136, 0.05);
}

.notification-item.unread {
    background: rgba(0, 255, 136, 0.08);
    border-left: 3px solid #00ff88;
}

.notification-icon {
    width: 45px;
    height: 45px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.notification-icon.success { background: rgba(0, 255, 136, 0.15); color: #00ff88; }
.notification-icon.info { background: rgba(0, 212, 255, 0.15); color: #00d4ff; }
.notification-icon.warning { background: rgba(255, 215, 0, 0.15); color: #ffd700; }
.notification-icon.danger { background: rgba(255, 68, 68, 0.15); color: #ff4444; }

.notification-icon i {
    font-size: 1.3rem;
}

.notification-content {
    flex: 1;
}

.notification-title {
    font-weight: bold;
    margin-bottom: 5px;
    color: #fff;
}

.notification-message {
    font-size: 0.85rem;
    color: #a0a0a0;
    margin-bottom: 5px;
}

.notification-time {
    font-size: 0.65rem;
    color: #6b6b6b;
    display: flex;
    align-items: center;
    gap: 5px;
}

.notification-actions {
    display: flex;
    gap: 8px;
}

.mark-read-btn {
    background: rgba(0, 255, 136, 0.15);
    border: none;
    border-radius: 8px;
    padding: 5px 12px;
    color: #00ff88;
    cursor: pointer;
    font-size: 0.7rem;
}

/* Loading */
.loading-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 60px;
    color: #a0a0a0;
}

.cyber-spinner {
    width: 30px;
    height: 30px;
    border: 2px solid rgba(0, 255, 136, 0.2);
    border-top-color: #00ff88;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Empty State */
.empty-state {
    text-align: center;
    padding: 60px;
    color: #6b6b6b;
}

.empty-state i {
    font-size: 4rem;
    margin-bottom: 15px;
    color: #00ff88;
}

/* Scrollbar */
.notifications-list::-webkit-scrollbar {
    width: 5px;
}

.notifications-list::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
}

.notifications-list::-webkit-scrollbar-thumb {
    background: #00ff88;
    border-radius: 10px;
}

/* Responsive */
@media (max-width: 768px) {
    .cyber-title {
        font-size: 1.5rem;
    }
    .notification-item {
        flex-direction: column;
        text-align: center;
    }
    .notification-actions {
        margin-top: 10px;
    }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
let socket = null;

async function loadNotifications() {
    try {
        const response = await fetch('/api/notifications');
        const data = await response.json();
        
        const container = document.getElementById('notificationsList');
        document.getElementById('unreadBadge').innerText = data.unread_count;
        
        if (data.notifications.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-bell-slash"></i>
                    <p>No notifications yet</p>
                    <small>You'll see notifications here when you receive updates</small>
                </div>
            `;
            return;
        }
        
        let html = '';
        data.notifications.forEach(notif => {
            const timeAgo = getTimeAgo(new Date(notif.created_at));
            const iconClass = getIconClass(notif.type, notif.icon);
            
            html += `
                <div class="notification-item ${notif.is_read ? '' : 'unread'}" data-id="${notif.id}">
                    <div class="notification-icon ${iconClass}">
                        <i class="fas ${getIcon(notif.type, notif.icon)}"></i>
                    </div>
                    <div class="notification-content">
                        <div class="notification-title">${escapeHtml(notif.title)}</div>
                        <div class="notification-message">${escapeHtml(notif.message)}</div>
                        <div class="notification-time">
                            <i class="fas fa-clock"></i> ${timeAgo}
                        </div>
                    </div>
                    <div class="notification-actions">
                        ${!notif.is_read ? `<button class="mark-read-btn" onclick="markAsRead(${notif.id})">Mark Read</button>` : ''}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        
    } catch(err) {
        console.error('Error loading notifications:', err);
    }
}

function getIconClass(type, customIcon) {
    if (customIcon) return 'success';
    switch(type) {
        case 'success': return 'success';
        case 'warning': return 'warning';
        case 'danger': return 'danger';
        default: return 'info';
    }
}

function getIcon(type, customIcon) {
    if (customIcon) return customIcon;
    switch(type) {
        case 'success': return 'fa-check-circle';
        case 'warning': return 'fa-exclamation-triangle';
        case 'danger': return 'fa-times-circle';
        default: return 'fa-info-circle';
    }
}

// Replace getTimeAgo function
function getTimeAgo(date) {
    const now = new Date();
    const istOffset = 5.5 * 60 * 60 * 1000;
    const istNow = new Date(now.getTime() + istOffset);
    const istDate = new Date(new Date(date).getTime() + istOffset);
    
    const seconds = Math.floor((istNow - istDate) / 1000);
    if (seconds < 60) return 'just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes} minute${minutes === 1 ? '' : 's'} ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
    const days = Math.floor(hours / 24);
    return `${days} day${days === 1 ? '' : 's'} ago`;
}

async function markAsRead(notificationId) {
    const response = await fetch('/api/notifications/mark-read', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ notification_id: notificationId })
    });
    
    if (response.ok) {
        loadNotifications();
    }
}

async function markAllRead() {
    const response = await fetch('/api/notifications/mark-all-read', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
    });
    
    if (response.ok) {
        loadNotifications();
        showToast('All notifications marked as read', 'success');
    }
}

function showToast(message, type) {
    const toast = document.createElement('div');
    toast.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
    toast.style.cssText = 'bottom: 20px; right: 20px; z-index: 9999; min-width: 280px; backdrop-filter: blur(10px);';
    toast.innerHTML = `<i class="fas fa-bell me-2"></i> ${message}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}



// Initialize Socket.IO for real-time notifications
function initNotificationSocket() {
    if (typeof io !== 'undefined') {
        socket = io();
        socket.on('new_notification', (data) => {
            showToast(data.message, data.type);
            loadNotifications();
        });
    }
}

loadNotifications();
initNotificationSocket();
</script>
{% endblock %}
