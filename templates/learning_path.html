{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <!-- Cyber Header -->
    <div class="cyber-header mb-5" data-aos="fade-down" data-aos-duration="800">
        <div class="cyber-header-glow"></div>
        <div class="cyber-header-content text-center">
            <div class="cyber-badge">
                <i class="fas fa-microchip"></i> AI-POWERED LEARNING PATH
                <span class="live-badge">PERSONALIZED</span>
            </div>
            <div class="path-icon">
                <i class="fas fa-road"></i>
                <div class="icon-ring"></div>
                <div class="icon-ring delay-1"></div>
                <div class="icon-ring delay-2"></div>
            </div>
            <h1 class="cyber-title">
                <span class="gradient-text">YOUR</span>
                <span class="neon-text">LEARNING</span>
                <span class="gradient-text">JOURNEY</span>
            </h1>
            <p class="cyber-subtitle">AI-generated personalized path • Smart recommendations • Track progress</p>
        </div>
    </div>

    <div id="learningPathContent">
        <div class="text-center py-5">
            <div class="cyber-loader"></div>
            <p class="mt-3 text-light">AI analyzing your performance...</p>
        </div>
    </div>
</div>

<style>
/* ============ LEARNING PATH FUTURISTIC STYLES ============ */

.cyber-header {
    position: relative;
    text-align: center;
    padding: 40px;
    background: linear-gradient(135deg, rgba(0, 255, 136, 0.05), rgba(0, 212, 255, 0.02));
    border-radius: 50px;
    overflow: hidden;
}

.cyber-header-glow {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.1), transparent);
    animation: headerPulse 3s ease-in-out infinite;
}

@keyframes headerPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
}

.cyber-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: rgba(0, 255, 136, 0.1);
    padding: 8px 20px;
    border-radius: 30px;
    font-size: 0.75rem;
    color: #00ff88;
    border: 1px solid rgba(0, 255, 136, 0.3);
    margin-bottom: 20px;
}

.live-badge {
    background: #00ff88;
    color: #000;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 0.65rem;
    font-weight: bold;
    animation: livePulse 1s ease-in-out infinite;
}

@keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.95); }
}

.path-icon {
    position: relative;
    display: inline-block;
    margin-bottom: 20px;
}

.path-icon i {
    font-size: 3rem;
    color: #00ff88;
}

.icon-ring {
    position: absolute;
    top: -15px;
    left: -15px;
    right: -15px;
    bottom: -15px;
    border: 2px solid rgba(0, 255, 136, 0.3);
    border-radius: 50%;
    animation: ringPulse 2s ease-out infinite;
}

.icon-ring.delay-1 { animation-delay: 0.7s; }
.icon-ring.delay-2 { animation-delay: 1.4s; }

@keyframes ringPulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.5); opacity: 0; }
}

.cyber-title {
    font-size: 2.5rem;
    font-weight: 800;
    margin-bottom: 15px;
}

.gradient-text {
    background: linear-gradient(135deg, #00ff88, #00d4ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.neon-text {
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
}

.cyber-subtitle {
    color: #a0a0a0;
    font-size: 1rem;
}

/* Stats Cards */
.stats-grid-premium {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.stat-card-premium {
    background: linear-gradient(135deg, rgba(15, 15, 26, 0.95), rgba(26, 26, 46, 0.95));
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    border: 1px solid rgba(0, 255, 136, 0.2);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.stat-card-premium:hover {
    transform: translateY(-5px);
    border-color: #00ff88;
}

.stat-card-premium .stat-icon {
    font-size: 2rem;
    color: #00ff88;
    margin-bottom: 10px;
}

.stat-card-premium .stat-value {
    font-size: 2rem;
    font-weight: bold;
    color: #00ff88;
}

.stat-card-premium .stat-label {
    font-size: 0.7rem;
    color: #6b6b6b;
}

/* Section Cards */
.section-card {
    background: linear-gradient(135deg, rgba(15, 15, 26, 0.95), rgba(26, 26, 46, 0.95));
    backdrop-filter: blur(10px);
    border-radius: 24px;
    border: 1px solid rgba(0, 255, 136, 0.3);
    overflow: hidden;
    margin-bottom: 25px;
}

.section-header {
    padding: 18px 24px;
    background: linear-gradient(90deg, rgba(0, 255, 136, 0.1), rgba(0, 212, 255, 0.05));
    border-bottom: 1px solid rgba(0, 255, 136, 0.3);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
    font-weight: bold;
    color: #00ff88;
    position: relative;
    overflow: hidden;
}

.section-header i {
    font-size: 1.2rem;
}

.header-glow-line {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00ff88, #00d4ff, transparent);
    animation: scanLine 2s linear infinite;
}

@keyframes scanLine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

.section-body {
    padding: 24px;
}

/* Focus Area Card */
.focus-card {
    background: linear-gradient(135deg, rgba(0, 255, 136, 0.08), rgba(0, 212, 255, 0.04));
    border-radius: 20px;
    padding: 25px;
    border-left: 4px solid #00ff88;
}

.focus-title {
    font-size: 1.2rem;
    font-weight: bold;
    color: #00ff88;
    margin-bottom: 15px;
}

.focus-description {
    color: #e0e0e0;
    line-height: 1.6;
}

/* Progress Timeline */
.timeline {
    position: relative;
    padding: 20px 0;
}

.timeline-item {
    position: relative;
    padding-left: 40px;
    margin-bottom: 30px;
}

.timeline-marker {
    position: absolute;
    left: 0;
    top: 0;
    width: 30px;
    height: 30px;
    background: linear-gradient(135deg, #00ff88, #00d4ff);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
}

.timeline-marker i {
    font-size: 0.8rem;
    color: #000;
}

.timeline-line {
    position: absolute;
    left: 14px;
    top: 30px;
    bottom: -30px;
    width: 2px;
    background: linear-gradient(180deg, #00ff88, rgba(0, 255, 136, 0.2));
}

.timeline-item:last-child .timeline-line {
    display: none;
}

.timeline-content {
    background: rgba(0, 255, 136, 0.05);
    border-radius: 16px;
    padding: 15px 20px;
    border: 1px solid rgba(0, 255, 136, 0.2);
}

.timeline-title {
    font-weight: bold;
    color: #00ff88;
    margin-bottom: 8px;
}

.timeline-text {
    font-size: 0.85rem;
    color: #a0a0a0;
}

/* Resource Cards */
.resources-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}

.resource-card {
    background: rgba(0, 212, 255, 0.05);
    border: 1px solid rgba(0, 212, 255, 0.2);
    border-radius: 16px;
    padding: 18px;
    transition: all 0.3s ease;
}

.resource-card:hover {
    transform: translateY(-3px);
    border-color: #00d4ff;
}

.resource-icon {
    width: 45px;
    height: 45px;
    background: rgba(0, 212, 255, 0.15);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
}

.resource-icon i {
    font-size: 1.3rem;
    color: #00d4ff;
}

.resource-title {
    font-weight: bold;
    margin-bottom: 5px;
    color: #fff;
}

.resource-desc {
    font-size: 0.75rem;
    color: #a0a0a0;
}

/* Goals List */
.goals-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.goal-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 15px;
    background: rgba(0, 255, 136, 0.05);
    border-radius: 12px;
    transition: all 0.3s ease;
}

.goal-item:hover {
    background: rgba(0, 255, 136, 0.1);
    transform: translateX(5px);
}

.goal-check {
    width: 24px;
    height: 24px;
    background: rgba(0, 255, 136, 0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.goal-check i {
    font-size: 0.7rem;
    color: #00ff88;
}

.goal-text {
    flex: 1;
    font-size: 0.85rem;
    color: #e0e0e0;
}

/* Progress Ring */
.progress-ring-card {
    text-align: center;
    padding: 20px;
}

.ring-container {
    position: relative;
    width: 150px;
    height: 150px;
    margin: 0 auto 15px;
}

.ring-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}

.ring-bg {
    stroke: rgba(0, 255, 136, 0.1);
}

.ring-progress {
    stroke: url(#ringGradient);
    stroke-linecap: round;
    transition: stroke-dashoffset 1s ease;
}

.ring-value {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 1.5rem;
    font-weight: bold;
    color: #00ff88;
}

/* Improvement Badge */
.improvement-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 255, 136, 0.15);
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 0.8rem;
    color: #00ff88;
}

/* Quote Premium Styles */
.quote-premium-container {
    padding: 35px 25px;
    background: linear-gradient(135deg, rgba(0, 255, 136, 0.08), rgba(0, 212, 255, 0.03));
    border-radius: 28px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(0, 255, 136, 0.2);
}

.quote-premium-container::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(0, 255, 136, 0.05), transparent);
    animation: rotateBg 20s linear infinite;
}

@keyframes rotateBg {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.quote-icon-wrapper {
    position: relative;
    display: inline-block;
    margin-bottom: 20px;
}

.quote-icon-wrapper i {
    font-size: 2.8rem;
    color: #00ff88;
    opacity: 0.7;
    position: relative;
    z-index: 2;
}

.quote-icon-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 60px;
    background: radial-gradient(circle, rgba(0, 255, 136, 0.3), transparent);
    border-radius: 50%;
    animation: iconGlow 2s ease-in-out infinite;
}

@keyframes iconGlow {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
}

.quote-text-wrapper {
    margin-bottom: 25px;
    position: relative;
    z-index: 2;
}

.quote-premium-text {
    font-size: 1.15rem;
    line-height: 1.6;
    color: #e0e0e0;
    font-style: italic;
    max-width: 85%;
    margin: 0 auto 15px;
    font-weight: 500;
}

.quote-premium-author {
    font-size: 0.85rem;
    color: #00ff88;
    letter-spacing: 1.5px;
    font-weight: 300;
}

.quote-refresh-btn {
    position: relative;
    background: linear-gradient(135deg, rgba(0, 255, 136, 0.12), rgba(0, 212, 255, 0.06));
    border: 1px solid rgba(0, 255, 136, 0.35);
    border-radius: 50px;
    padding: 10px 32px;
    color: #00ff88;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: all 0.3s ease;
    overflow: hidden;
    z-index: 2;
    position: relative;
}

.quote-refresh-btn:hover {
    transform: translateY(-3px);
    background: rgba(0, 255, 136, 0.2);
    border-color: #00ff88;
    box-shadow: 0 5px 20px rgba(0, 255, 136, 0.2);
}

.quote-refresh-btn i {
    font-size: 0.9rem;
    transition: transform 0.3s ease;
}

.quote-refresh-btn:hover i {
    transform: rotate(180deg);
}

.btn-radar {
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.15), transparent);
    transition: left 0.6s ease;
}

.quote-refresh-btn:hover .btn-radar {
    left: 100%;
}

/* Cyber Loader */
.cyber-loader {
    width: 50px;
    height: 50px;
    border: 3px solid rgba(0, 255, 136, 0.2);
    border-top-color: #00ff88;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Responsive */
@media (max-width: 992px) {
    .stats-grid-premium {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 768px) {
    .cyber-title {
        font-size: 1.5rem;
    }
    .stats-grid-premium {
        grid-template-columns: 1fr;
    }
    .resources-grid {
        grid-template-columns: 1fr;
    }
    .quote-premium-text {
        max-width: 100%;
        font-size: 0.95rem;
    }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
AOS.init({ duration: 800, once: true });

// Quote refresh function
function refreshQuote() {
    const quotes = [
        { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
        { text: "Education is the most powerful weapon which you can use to change the world.", author: "Nelson Mandela" },
        { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
        { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
        { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
        { text: "Your potential is limitless. Keep pushing forward!", author: "Nexus AI" },
        { text: "Small progress is still progress. Don't give up!", author: "Nexus AI" },
        { text: "The expert in anything was once a beginner.", author: "Helen Hayes" },
        { text: "Don't watch the clock; do what it does. Keep going.", author: "Sam Levenson" },
        { text: "The secret of getting ahead is getting started.", author: "Mark Twain" },
        { text: "Strive for progress, not perfection.", author: "Unknown" },
        { text: "The only limit to your impact is your imagination and commitment.", author: "Tony Robbins" }
    ];
    const random = quotes[Math.floor(Math.random() * quotes.length)];
    const quoteText = document.getElementById('motivationQuoteText');
    const quoteAuthor = document.getElementById('motivationQuoteAuthor');
    if (quoteText) quoteText.innerHTML = `"${random.text}"`;
    if (quoteAuthor) quoteAuthor.innerHTML = `- ${random.author}`;
}

// Set initial quote with data
function setInitialQuote(data) {
    const quotes = [
        { text: `Your current score is ${data.current_score}%. With consistent effort, you can reach ${data.predicted_grade}!`, author: "Nexus AI" },
        { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
        { text: "Education is the most powerful weapon which you can use to change the world.", author: "Nelson Mandela" }
    ];
    const random = quotes[Math.floor(Math.random() * quotes.length)];
    const quoteText = document.getElementById('motivationQuoteText');
    const quoteAuthor = document.getElementById('motivationQuoteAuthor');
    if (quoteText) quoteText.innerHTML = `"${random.text}"`;
    if (quoteAuthor) quoteAuthor.innerHTML = `- ${random.author}`;
}

async function loadLearningPath() {
    try {
        const response = await fetch('/api/learning-path');
        const data = await response.json();
        
        document.getElementById('learningPathContent').innerHTML = `
            <!-- Stats Cards -->
            <div class="stats-grid-premium mb-4" data-aos="fade-up">
                <div class="stat-card-premium">
                    <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
                    <div class="stat-value">${data.current_score}%</div>
                    <div class="stat-label">Current Score</div>
                </div>
                <div class="stat-card-premium">
                    <div class="stat-icon"><i class="fas fa-star"></i></div>
                    <div class="stat-value">${data.current_grade}</div>
                    <div class="stat-label">Current Grade</div>
                </div>
                <div class="stat-card-premium">
                    <div class="stat-icon"><i class="fas fa-bullseye"></i></div>
                    <div class="stat-value">${data.predicted_grade}</div>
                    <div class="stat-label">Target Grade</div>
                </div>
                <div class="stat-card-premium">
                    <div class="stat-icon"><i class="fas fa-chart-simple"></i></div>
                    <div class="stat-value">+${data.estimated_improvement}%</div>
                    <div class="stat-label">Est. Improvement</div>
                </div>
            </div>

            <!-- Main Content Row -->
            <div class="row g-4">
                <!-- Left Column - Focus Area & Timeline -->
                <div class="col-lg-6" data-aos="fade-right">
                    <!-- Focus Area Card -->
                    <div class="section-card">
                        <div class="section-header">
                            <i class="fas fa-bullseye"></i>
                            <span>FOCUS AREA</span>
                            <div class="header-glow-line"></div>
                        </div>
                        <div class="section-body">
                            <div class="focus-card">
                                <div class="focus-title">
                                    <i class="fas fa-exclamation-triangle"></i> Weakest Area: ${data.weakest_area}
                                </div>
                                <div class="focus-description">
                                    ${data.focus_area}
                                </div>
                                <div class="mt-3">
                                    <div class="improvement-badge">
                                        <i class="fas fa-chart-line"></i>
                                        <span>Priority improvement needed</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Learning Timeline -->
                    <div class="section-card">
                        <div class="section-header">
                            <i class="fas fa-timeline"></i>
                            <span>WEEKLY LEARNING TIMELINE</span>
                            <div class="header-glow-line"></div>
                        </div>
                        <div class="section-body">
                            <div class="timeline">
                                ${data.weekly_goals.map((goal, index) => `
                                    <div class="timeline-item">
                                        <div class="timeline-marker">
                                            <i class="fas fa-${index === 0 ? 'flag-checkered' : (index === data.weekly_goals.length-1 ? 'trophy' : 'circle')}"></i>
                                        </div>
                                        <div class="timeline-line"></div>
                                        <div class="timeline-content">
                                            <div class="timeline-title">Week ${index + 1}</div>
                                            <div class="timeline-text">${goal}</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column - Daily Tasks & Resources -->
                <div class="col-lg-6" data-aos="fade-left">
                    <!-- Daily Tasks Card -->
                    <div class="section-card">
                        <div class="section-header">
                            <i class="fas fa-tasks"></i>
                            <span>DAILY TASKS</span>
                            <div class="header-glow-line"></div>
                        </div>
                        <div class="section-body">
                            <div class="goals-list">
                                ${data.daily_tasks.map(task => `
                                    <div class="goal-item">
                                        <div class="goal-check">
                                            <i class="fas fa-check"></i>
                                        </div>
                                        <div class="goal-text">${task}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Study Habits Card -->
                    <div class="section-card">
                        <div class="section-header">
                            <i class="fas fa-clock"></i>
                            <span>STUDY HABITS</span>
                            <div class="header-glow-line"></div>
                        </div>
                        <div class="section-body">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <div class="progress-ring-card">
                                        <div class="ring-container">
                                            <svg class="ring-svg" viewBox="0 0 120 120">
                                                <defs>
                                                    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                                        <stop offset="0%" style="stop-color:#00ff88"/>
                                                        <stop offset="100%" style="stop-color:#00d4ff"/>
                                                    </linearGradient>
                                                </defs>
                                                <circle class="ring-bg" cx="60" cy="60" r="52" fill="none" stroke-width="8"/>
                                                <circle class="ring-progress" cx="60" cy="60" r="52" fill="none" stroke-width="8" 
                                                        stroke-dasharray="326.7" stroke-dashoffset="${326.7 - (data.recommended_study_hours / 12) * 326.7}"/>
                                            </svg>
                                            <div class="ring-value">${data.recommended_study_hours}h</div>
                                        </div>
                                        <div class="stat-label">Recommended Daily Study</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="progress-ring-card">
                                        <div class="ring-container">
                                            <svg class="ring-svg" viewBox="0 0 120 120">
                                                <circle class="ring-bg" cx="60" cy="60" r="52" fill="none" stroke-width="8"/>
                                                <circle class="ring-progress" cx="60" cy="60" r="52" fill="none" stroke-width="8" 
                                                        stroke-dasharray="326.7" stroke-dashoffset="${326.7 - (data.recommended_attendance / 100) * 326.7}"/>
                                            </svg>
                                            <div class="ring-value">${data.recommended_attendance}%</div>
                                        </div>
                                        <div class="stat-label">Target Attendance</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Resources Card -->
                    <div class="section-card">
                        <div class="section-header">
                            <i class="fas fa-book"></i>
                            <span>RECOMMENDED RESOURCES</span>
                            <div class="header-glow-line"></div>
                        </div>
                        <div class="section-body">
                            <div class="resources-grid">
                                ${data.resources.map(resource => `
                                    <div class="resource-card">
                                        <div class="resource-icon">
                                            <i class="fas fa-link"></i>
                                        </div>
                                        <div class="resource-title">${resource}</div>
                                        <div class="resource-desc">Click to access learning material</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Progress Chart -->
            <div class="section-card mt-4" data-aos="fade-up">
                <div class="section-header">
                    <i class="fas fa-chart-line"></i>
                    <span>PREDICTED PROGRESS TRACKER</span>
                    <div class="header-glow-line"></div>
                </div>
                <div class="section-body">
                    <canvas id="progressChart" height="200"></canvas>
                    <div class="text-center mt-3">
                        <small class="text-muted">
                            <i class="fas fa-chart-line"></i> Following this path will help you reach ${data.predicted_grade} grade
                        </small>
                    </div>
                </div>
            </div>

            <!-- Motivation Quote -->
            <div class="section-card mt-4" data-aos="zoom-in">
                <div class="section-header">
                    <i class="fas fa-quote-left"></i>
                    <span>AI MOTIVATION</span>
                    <div class="header-glow-line"></div>
                </div>
                <div class="section-body text-center">
                    <div class="quote-premium-container">
                        <div class="quote-icon-wrapper">
                            <div class="quote-icon-glow"></div>
                            <i class="fas fa-quote-right"></i>
                        </div>
                        <div class="quote-text-wrapper">
                            <p class="quote-premium-text" id="motivationQuoteText">Loading motivation...</p>
                            <p class="quote-premium-author" id="motivationQuoteAuthor">- Nexus AI</p>
                        </div>
                        <button class="quote-refresh-btn" id="refreshQuoteBtn">
                            <i class="fas fa-sync-alt"></i>
                            <span>NEW QUOTE</span>
                            <div class="btn-radar"></div>
                        </button>
                    </div>
                </div>
            </div>
        `;

        // Create progress chart
        const ctx = document.getElementById('progressChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                datasets: [{
                    label: 'Your Projected Score',
                    data: [data.current_score, data.current_score + 3, data.current_score + 6, data.current_score + data.estimated_improvement],
                    borderColor: '#00ff88',
                    backgroundColor: 'rgba(0, 255, 136, 0.1)',
                    fill: true,
                    tension: 0.3,
                    pointBackgroundColor: '#00ff88',
                    pointBorderColor: '#fff',
                    pointRadius: 6,
                    pointHoverRadius: 8
                }, {
                    label: 'Class Average',
                    data: [68, 70, 72, 74],
                    borderColor: '#00d4ff',
                    backgroundColor: 'rgba(0, 212, 255, 0.05)',
                    fill: true,
                    tension: 0.3,
                    pointBackgroundColor: '#00d4ff',
                    pointBorderColor: '#fff',
                    pointRadius: 6,
                    pointHoverRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { labels: { color: '#fff' } },
                    tooltip: { backgroundColor: '#000', titleColor: '#fff', bodyColor: '#fff' }
                },
                scales: {
                    y: { 
                        min: 40, 
                        max: 100, 
                        ticks: { color: '#fff' }, 
                        grid: { color: 'rgba(255,255,255,0.1)' },
                        title: { display: true, text: 'Score (%)', color: '#00ff88' }
                    },
                    x: { 
                        ticks: { color: '#fff' },
                        title: { display: true, text: 'Timeline', color: '#00ff88' }
                    }
                }
            }
        });

        // Set initial quote
        setInitialQuote(data);
        
        // Add event listener for refresh button
        const refreshBtn = document.getElementById('refreshQuoteBtn');
        if (refreshBtn) {
            refreshBtn.addEventListener('click', refreshQuote);
        }
        
    } catch(err) {
        console.error('Error:', err);
        document.getElementById('learningPathContent').innerHTML = '<div class="alert alert-danger text-center">Error loading learning path. Please refresh.</div>';
    }
}

loadLearningPath();
</script>
{% endblock %}
